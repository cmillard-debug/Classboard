<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Questions</title>
<style>
:root {
  --bg: #f4f2ec;
  --panel: #ffffff;
  --ink: #1f2328;
  --muted: #6a6e75;
  --line: #e2ded4;
  --accent: #0e6b6b;
  --accent-dark: #0a5454;
  --accent-soft: #e0efee;
  --live: #d33a2c;
  --live-soft: #fbe7e4;
  --amber: #a86a00;
  --amber-soft: #fbf0d9;
  --shadow: 0 1px 2px rgba(31,35,40,.06), 0 4px 16px rgba(31,35,40,.06);
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.btn {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 9px 14px;
  font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: background .15s, border-color .15s, transform .05s;
  white-space: nowrap;
}
.btn:hover { background: #f8f7f3; border-color: #cfcabe; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-dark); }
.btn.danger { color: var(--live); }
.btn.on, .btn.on:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
.btn.big { padding: 14px 20px; font-size: 1.1rem; border-radius: 12px; }
.btn.small { padding: 5px 9px; font-size: .85rem; border-radius: 8px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: rgba(0,0,0,.05); }
.btn svg { width: 18px; height: 18px; flex: none; }

.field {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  background: #fff;
  outline: none;
  transition: border-color .15s;
}
.field:focus { border-color: var(--accent); }
textarea.field { resize: vertical; min-height: 120px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px;
  font-weight: 500; z-index: 100; max-width: calc(100% - 32px); box-shadow: var(--shadow);
}
.toast.err { background: var(--live); }

/* ---------- Student ---------- */
.s-wrap {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding: max(14px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column;
}
.s-top {
  display: flex; align-items: center; justify-content: space-between;
  color: var(--muted); font-size: .9rem; margin-bottom: 14px; min-height: 28px;
}
.s-top b { color: var(--ink); }
.s-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2e9d63; margin-right: 6px; }
.s-dot.off { background: var(--live); }
.s-card {
  background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 18px;
}
.s-center { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.s-title { font-size: 1.6rem; font-weight: 750; margin: 0 0 6px; letter-spacing: -.01em; }
.s-sub { color: var(--muted); margin: 0 0 22px; }
.s-join .field { font-size: 1.2rem; text-align: center; margin-bottom: 14px; }
.s-join .btn { width: 100%; }
.waiting-dots { display: flex; gap: 8px; justify-content: center; margin: 26px 0 0; }
.waiting-dots span {
  width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
  animation: bob 1.2s infinite ease-in-out;
}
.waiting-dots span:nth-child(2) { animation-delay: .15s; }
.waiting-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 80%, 100% { transform: scale(.55); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .waiting-dots span { animation: none; opacity: .7; } }

.s-prompt { font-size: 1.25rem; font-weight: 700; margin: 0 0 14px; line-height: 1.3; }
.s-prompt.muted { color: var(--muted); font-weight: 600; font-size: 1.05rem; }
.s-actions { display: flex; gap: 10px; margin-top: 14px; }
.s-actions .btn { flex: 1; }
.draw-acts .btn:not(.primary) { flex: none; padding: 0 16px; }
.draw-acts .btn svg { width: 22px; height: 22px; }
.s-note { color: var(--muted); font-size: .9rem; margin: 10px 0 0; text-align: center; }
.s-err { color: var(--live); font-weight: 600; margin: 10px 0 0; text-align: center; }
.s-sent {
  display: flex; align-items: center; gap: 8px; justify-content: center;
  color: #1f7a4c; font-weight: 700; margin: 14px 0 0;
}
.s-closed {
  background: var(--amber-soft); color: var(--amber); font-weight: 700;
  border-radius: 10px; padding: 10px 12px; text-align: center; margin: 12px 0 0;
}
.s-bubble {
  background: var(--accent-soft); border-radius: 12px; padding: 12px 14px;
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.1rem;
}
.count { text-align: right; color: var(--muted); font-size: .8rem; margin-top: 4px; }

.pad { position: relative; margin: 0 auto; }
.pad canvas {
  display: block; width: 100%; height: 100%; background: #fff;
  border: 1.5px solid var(--line); border-radius: 12px; touch-action: none;
}
.pad.readonly canvas { border-style: dashed; }
.tools { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; flex-wrap: wrap; justify-content: center; }
.swatch {
  width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff;
  box-shadow: 0 0 0 1.5px var(--line); padding: 0;
}
.swatch.on { box-shadow: 0 0 0 3px var(--ink); }
.sizebtn {
  width: 40px; height: 36px; border-radius: 9px; border: 1.5px solid var(--line); background: #fff;
  display: inline-flex; align-items: center; justify-content: center;
}
.sizebtn.on { border-color: var(--ink); }
.sizebtn i { display: block; border-radius: 50%; background: var(--ink); }
.tools .sep { width: 1px; height: 26px; background: var(--line); margin: 0 2px; }

.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left;
  border: 2px solid var(--line); background: #fff; border-radius: 12px;
  padding: 14px; font-size: 1.1rem; font-weight: 600; min-height: 56px;
}
.opt .let {
  flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft);
  color: var(--accent-dark); display: grid; place-items: center; font-weight: 800;
}
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt.on .let { background: var(--accent); color: #fff; }
.opt:disabled { cursor: default; }

/* ---------- Teacher ---------- */
.t { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
.t-head {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0;
}
.t-logo { font-weight: 800; letter-spacing: -.01em; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.t-logo i { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: inline-block; }
.t-status { color: var(--muted); font-size: .9rem; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.t-status b { color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 9px; font-size: .75rem; font-weight: 800; letter-spacing: .03em; }
.pill.live { background: var(--live-soft); color: var(--live); }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: blink 1.6s infinite; }
.pill.lock { background: var(--amber-soft); color: var(--amber); }
.pill.count { background: #eeece6; color: var(--muted); }
@keyframes blink { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .pill.live::before { animation: none; } }

.t-body { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
.t-body.focus { grid-template-columns: 1fr; }
.t-body.focus .t-side { display: none; }
.t-side {
  background: #faf9f6; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.quick { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.quick-label { font-size: .75rem; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.quick-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.quick-row .btn { padding: 9px 6px; font-size: .9rem; }
.qlist { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
.qi {
  border-radius: 10px; padding: 9px 10px; cursor: pointer; margin-bottom: 2px;
  border: 1.5px solid transparent;
}
.qi:hover { background: #f0eee8; }
.qi.sel { background: #fff; border-color: var(--line); box-shadow: var(--shadow); }
.qi-row { display: flex; align-items: center; gap: 9px; }
.qi-n { color: var(--muted); font-weight: 700; font-size: .85rem; width: 18px; text-align: right; flex: none; }
.qi-ic { color: var(--accent); flex: none; display: flex; }
.qi-ic svg { width: 17px; height: 17px; }
.qi-p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.qi-p.muted { color: var(--muted); font-weight: 500; font-style: italic; }
.qi-acts { display: flex; gap: 4px; margin: 8px 0 0 27px; flex-wrap: wrap; }
.side-foot { padding: 10px 14px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.side-foot .row { display: flex; justify-content: space-between; gap: 8px; }
.empty-list { color: var(--muted); padding: 18px 10px; font-size: .92rem; text-align: center; }

.t-main { overflow-y: auto; padding: 26px 32px 40px; min-width: 0; }
.q-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 650; font-size: .9rem; margin-bottom: 6px; flex-wrap: wrap; }
.q-prompt { font-size: clamp(1.6rem, 2.6vw, 2.5rem); line-height: 1.2; margin: 0 0 18px; letter-spacing: -.015em; font-weight: 780; overflow-wrap: anywhere; }
.q-prompt.muted { color: var(--muted); font-weight: 600; font-size: clamp(1.2rem, 1.8vw, 1.6rem); }
.q-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }

.hold { text-align: center; padding: 6vh 0; }
.hold-n { font-size: clamp(5rem, 13vw, 10rem); font-weight: 800; line-height: 1; color: var(--accent); letter-spacing: -.04em; }
.hold-l { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }
.hold-s { color: var(--muted); margin-top: 8px; }
.none { color: var(--muted); text-align: center; padding: 8vh 0; font-size: 1.2rem; }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 240px), 1fr)); }
.tile {
  background: #fff; border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
  cursor: zoom-in; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column;
}
.tile img { display: block; width: 100%; aspect-ratio: 1; background: #fff; }
.tile .who { padding: 6px 12px 9px; font-weight: 650; color: var(--muted); font-size: .9rem; border-top: 1px solid #f0eee8; }
.card { padding: 16px 18px; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.3; flex: 1; }
.card.s1 { font-size: 2rem; } .card.s2 { font-size: 1.55rem; } .card.s3 { font-size: 1.25rem; } .card.s4 { font-size: 1.05rem; }
.hidden-bar { margin-top: 22px; color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: 10px; }
.grid.dim .tile { opacity: .45; }

.bars { display: grid; gap: 16px; max-width: 980px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 34%) 1fr 90px; align-items: center; gap: 14px; }
.bar-label { font-weight: 700; font-size: 1.35rem; display: flex; align-items: center; gap: 12px; overflow-wrap: anywhere; }
.bar-label .let { flex: none; width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-dark); display: grid; place-items: center; font-weight: 800; }
.bar-track { height: 46px; background: #ebe8e0; border-radius: 10px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 10px; min-width: 6px; transition: width .4s ease; }
.bar-num { font-weight: 800; font-size: 1.35rem; }
.bar-num small { color: var(--muted); font-weight: 600; font-size: .9rem; display: block; }
.bar-names { grid-column: 2 / 4; color: var(--muted); font-size: .9rem; margin-top: -8px; }

.welcome { max-width: 640px; margin: 8vh auto 0; text-align: center; }
.welcome h1 { font-size: 2rem; margin: 0 0 8px; }
.welcome p { color: var(--muted); margin: 0 0 22px; }
.welcome .quick-row { max-width: 460px; margin: 0 auto; }
.welcome .quick-row .btn { padding: 16px 8px; font-size: 1rem; flex-direction: column; }
.welcome .quick-row .btn svg { width: 26px; height: 26px; }

/* overlays */
.ov {
  position: fixed; inset: 0; background: rgba(20,22,25,.55); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.ov.dark { background: rgba(14,15,17,.92); }
.modal { background: #fff; border-radius: 16px; padding: 22px; width: min(560px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: calc(100vh - 40px); overflow-y: auto; }
.modal h2 { margin: 0 0 14px; font-size: 1.3rem; }
.modal p { margin: 0 0 18px; color: var(--muted); }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #f0eee8; padding: 4px; border-radius: 12px; margin-bottom: 14px; }
.seg button { border: 0; background: transparent; padding: 9px; border-radius: 9px; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 7px; }
.seg button.on { background: #fff; box-shadow: var(--shadow); }
.seg svg { width: 18px; height: 18px; }
.lbl { font-weight: 700; font-size: .9rem; margin: 0 0 6px; display: block; }
.hint { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
.optrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.optrow .let { width: 30px; font-weight: 800; color: var(--accent-dark); text-align: center; flex: none; }
.optrow .field { padding: 9px 12px; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }

.qr-box { background: #fff; border-radius: 20px; padding: 30px 34px; text-align: center; max-width: 100%; }
.qr-box h2 { margin: 0 0 4px; font-size: 2rem; }
.qr-box p { margin: 0 0 18px; color: var(--muted); font-size: 1.1rem; }
#qr { display: inline-block; padding: 10px; background: #fff; }
#qr img, #qr canvas { display: block; width: min(340px, 60vh) !important; height: auto !important; }
.qr-url { margin-top: 14px; font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }

.spot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; height: 100%; justify-content: center; }
.spot-body { background: #fff; border-radius: 16px; overflow: hidden; max-width: min(92vw, 1100px); }
.spot-body img { display: block; width: min(80vh, 88vw); height: auto; aspect-ratio: 1; }
.spot-body .card { font-size: clamp(1.8rem, 4vw, 3.4rem); padding: 34px 40px; max-height: 76vh; overflow-y: auto; min-width: min(560px, 88vw); }
.spot-bar { display: flex; gap: 10px; align-items: center; color: #fff; }
.spot-bar .who { font-weight: 700; font-size: 1.1rem; margin: 0 10px; }
.spot-bar .btn { background: rgba(255,255,255,.12); border-color: transparent; color: #fff; }
.spot-bar .btn:hover { background: rgba(255,255,255,.22); }

.keybox { max-width: 380px; margin: 14vh auto 0; padding: 0 16px; text-align: center; }
.keybox .field { text-align: center; font-size: 1.2rem; margin: 18px 0 12px; letter-spacing: .1em; }

@media (max-width: 760px) {
  .t-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .t-side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  .t-main { padding: 18px 16px 30px; }
  .t-status { display: none; }
  .bar-row { grid-template-columns: 1fr 70px; }
  .bar-row .bar-label { grid-column: 1 / 3; }
  .bar-names { grid-column: 1 / 3; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   Live Questions. One page for students and the teacher.
   Students:  live.html          Teacher:  live.html#teacher
   ===================================================================== */

// Your Apps Script web app link (Deploy > Manage deployments > Web app URL).
const API = 'https://script.google.com/macros/s/AKfycbzrYiTzK1oVR7RK1tLeBW8T0vre9qA-VGeDQC4WpAcJUiddaHitNkBQcAHSLQZLYIOg/exec';

const STUDENT_POLL = 2500;
const TEACHER_POLL = 2000;
const COLORS = ['#1f2328', '#d33a2c', '#1f6fd6', '#1f9a52'];
const WIDTHS = [9, 24];
const LETTERS = 'ABCDEF';
const MAX_TEXT = 500;

const app = document.getElementById('app');

/* ---------------- shared helpers ---------------- */

const ICON = {
  draw: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>',
  poll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10"/><path d="M4 12h16"/><path d="M4 18h7"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  unlock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.2A6.5 6.5 0 0 1 21.5 20"/></svg>',
  side: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="m5 12 5 5L20 7"/></svg>'
};
const TYPE_NAME = { draw: 'Draw', text: 'Text', poll: 'Poll' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function randId(n) {
  const a = 'abcdefghijkmnpqrstuvwxyz23456789';
  let s = '';
  for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}
let toastTimer = null;
function toast(msg, err) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); document.body.appendChild(el); }
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), err ? 4500 : 2500);
}

async function api(fn, args, key) {
  let res;
  try {
    res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args || [], key: key || '' })
    });
  } catch (e) {
    const err = new Error('No connection. Check the Wi-Fi and try again.');
    err.offline = true;
    throw err;
  }
  let j;
  try { j = await res.json(); } catch (e) {
    const err = new Error('The server did not answer properly. Try again.');
    err.offline = true;
    throw err;
  }
  if (j.error) throw new Error(j.error);
  return j.result;
}

/* ---------------- drawing ---------------- */

function drawStroke(ctx, s, size) {
  const k = size / 1000;
  const p = s.slice(2);
  const color = COLORS[s[0]] || COLORS[0];
  const w = (WIDTHS[s[1]] || WIDTHS[0]) * k;
  if (p.length < 2) return;
  if (p.length <= 2) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p[0] * k, p[1] * k, w / 2, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(p[0] * k, p[1] * k);
  for (let i = 2; i < p.length - 2; i += 2) {
    ctx.quadraticCurveTo(p[i] * k, p[i + 1] * k, (p[i] + p[i + 2]) / 2 * k, (p[i + 1] + p[i + 3]) / 2 * k);
  }
  ctx.lineTo(p[p.length - 2] * k, p[p.length - 1] * k);
  ctx.stroke();
}
function paint(ctx, strokes, size) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, size, size);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const s of strokes) drawStroke(ctx, s, size);
}
const imgCache = new Map();
function drawingUrl(json, cacheKey) {
  if (cacheKey && imgCache.has(cacheKey)) return imgCache.get(cacheKey);
  let strokes = [];
  try { strokes = JSON.parse(json); } catch (e) {}
  const c = document.createElement('canvas');
  c.width = c.height = 600;
  paint(c.getContext('2d'), Array.isArray(strokes) ? strokes : [], 600);
  const url = c.toDataURL('image/png');
  if (cacheKey) imgCache.set(cacheKey, url);
  return url;
}

/** Turns a canvas into a drawing pad. Strokes are [color, width, x, y, x, y...] in 0..1000. */
function makePad(canvas, strokes, opts) {
  const ctx = canvas.getContext('2d');
  let size = 0, cur = null;
  function fit() {
    size = canvas.clientWidth;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paint(ctx, strokes, size);
  }
  function pt(e) {
    const r = canvas.getBoundingClientRect();
    const x = Math.round(Math.min(1000, Math.max(0, (e.clientX - r.left) / r.width * 1000)));
    const y = Math.round(Math.min(1000, Math.max(0, (e.clientY - r.top) / r.height * 1000)));
    return [x, y];
  }
  canvas.addEventListener('pointerdown', e => {
    if (!opts.editable()) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const [x, y] = pt(e);
    cur = [opts.color(), opts.width(), x, y];
    strokes.push(cur);
    paint(ctx, strokes, size);
    opts.onChange();
  });
  canvas.addEventListener('pointermove', e => {
    if (!cur) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const k = size / 1000;
    for (const ev of (evs.length ? evs : [e])) {
      const [x, y] = pt(ev);
      const lx = cur[cur.length - 2], ly = cur[cur.length - 1];
      if (Math.hypot(x - lx, y - ly) < 3) continue;
      cur.push(x, y);
      ctx.strokeStyle = COLORS[cur[0]];
      ctx.lineWidth = WIDTHS[cur[1]] * k;
      ctx.beginPath();
      ctx.moveTo(lx * k, ly * k);
      ctx.lineTo(x * k, y * k);
      ctx.stroke();
    }
  });
  const end = () => {
    if (!cur) return;
    cur = null;
    paint(ctx, strokes, size);
    opts.onChange();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  fit();
  return { fit: fit, redraw: () => paint(ctx, strokes, size) };
}

const S = {
  name: store('lq_name') || '',
  sid: store('lq_sid') || '',
  live: null, key: '', view: '',
  mode: 'edit',          // edit | sent
  text: '', strokes: [], choice: null,
  color: 0, width: 0,
  sending: false, err: '', offline: false,
  pad: null, timer: null
};
if (!S.sid) { S.sid = randId(12); store('lq_sid', S.sid); }

function recKey() { return 'lq_ans_' + S.key; }
function saveRec(obj) { store(recKey(), JSON.stringify(obj)); }
function loadRec() { try { return JSON.parse(store(recKey()) || 'null'); } catch (e) { return null; } }

function sTop() {
  return '<div class="s-top"><span><span class="s-dot' + (S.offline ? ' off' : '') + '"></span>' +
    (S.offline ? 'Reconnecting…' : 'Connected') + '</span>' +
    (S.name ? '<span>You: <b>' + esc(S.name) + '</b> · <button class="btn ghost small" data-act="rename">change</button></span>' : '') +
    '</div>';
}

function sJoin() {
  S.view = 'join';
  app.innerHTML = '<div class="s-wrap">' +
    '<div class="s-center"><form class="s-card s-join" id="joinForm">' +
    '<h1 class="s-title">Hi! 👋</h1><p class="s-sub">Type your first name to join the class.</p>' +
    '<input class="field" id="nameIn" maxlength="30" autocomplete="given-name" placeholder="Your first name" value="' + esc(S.name) + '">' +
    '<button class="btn primary big" type="submit">Join</button>' +
    '</form></div></div>';
  const inp = document.getElementById('nameIn');
  inp.focus();
  document.getElementById('joinForm').onsubmit = e => {
    e.preventDefault();
    const n = inp.value.trim().slice(0, 30);
    if (!n) { inp.focus(); return; }
    S.name = n;
    store('lq_name', n);
    S.key = '';
    S.live = null;
    sWait();
    sPoll();
  };
}

function sWait() {
  S.view = 'wait';
  app.innerHTML = '<div class="s-wrap">' + sTop() +
    '<div class="s-center"><div class="s-card" style="padding:34px 20px">' +
    '<h1 class="s-title">You\'re in, ' + esc(S.name) + '!</h1>' +
    '<p class="s-sub" style="margin:0">Waiting for the next question…</p>' +
    '<div class="waiting-dots"><span></span><span></span><span></span></div>' +
    '</div></div></div>';
}

function sQuestion() {
  S.view = 'q';
  const L = S.live;
  const locked = L.locked;
  const prompt = L.prompt
    ? '<h1 class="s-prompt">' + esc(L.prompt) + '</h1>'
    : '<h1 class="s-prompt muted">' + (L.type === 'draw' ? 'Draw your answer' : L.type === 'poll' ? 'Choose your answer' : 'Type your answer') + '</h1>';
  let body = '';

  if (L.type === 'text') {
    if (S.mode === 'sent' || locked) {
      body = S.text
        ? '<div class="s-bubble">' + esc(S.text) + '</div>'
        : '<p class="s-note">You didn\'t send an answer.</p>';
      if (!locked && S.mode === 'sent') {
        body += '<div class="s-sent">' + ICON.check + 'Sent</div>' +
          '<div class="s-actions"><button class="btn" data-act="edit">Change my answer</button></div>';
      }
    } else {
      body = '<textarea class="field" id="txt" maxlength="' + MAX_TEXT + '" placeholder="Type here…">' + esc(S.text) + '</textarea>' +
        '<div class="count" id="cnt">' + S.text.length + ' / ' + MAX_TEXT + '</div>' +
        '<div class="s-actions"><button class="btn primary big" data-act="send"' + (S.sending ? ' disabled' : '') + '>' + (S.sending ? 'Sending…' : 'Send') + '</button></div>';
    }
  } else if (L.type === 'poll') {
    body = '<div class="opts">' + L.options.map((o, i) => {
      const plain = o.trim().toUpperCase() === LETTERS[i];
      return '<button class="opt' + (S.choice === i ? ' on' : '') + '" data-act="choose" data-i="' + i + '"' + (locked || S.sending ? ' disabled' : '') + '>' +
        '<span class="let">' + LETTERS[i] + '</span>' + (plain ? '' : '<span>' + esc(o) + '</span>') + '</button>';
    }).join('') + '</div>';
    if (S.mode === 'sent' && !locked) body += '<div class="s-sent">' + ICON.check + 'Sent · tap another to change</div>';
    if (S.mode !== 'sent' && locked) body += '<p class="s-note">You didn\'t answer this one.</p>';
  } else {
    const editing = S.mode !== 'sent' && !locked;
    const showPad = editing || S.mode === 'sent';
    body = showPad ? '<div class="pad' + (editing ? '' : ' readonly') + '" id="padBox"><canvas id="pad" aria-label="Drawing area"></canvas></div>' : '';
    if (editing) {
      body += '<div class="tools">' +
        COLORS.map((c, i) => '<button class="swatch' + (S.color === i ? ' on' : '') + '" data-act="color" data-i="' + i + '" style="background:' + c + '" aria-label="Colour ' + (i + 1) + '"></button>').join('') +
        '<span class="sep"></span>' +
        WIDTHS.map((w, i) => '<button class="sizebtn' + (S.width === i ? ' on' : '') + '" data-act="size" data-i="' + i + '" aria-label="' + (i ? 'Thick' : 'Thin') + ' pen"><i style="width:' + (i ? 14 : 6) + 'px;height:' + (i ? 14 : 6) + 'px"></i></button>').join('') +
        '</div>' +
        '<div class="s-actions draw-acts">' +
        '<button class="btn" data-act="undo"' + (S.strokes.length ? '' : ' disabled') + ' aria-label="Undo">' + ICON.undo + '</button>' +
        '<button class="btn" data-act="clear"' + (S.strokes.length ? '' : ' disabled') + '>Clear</button>' +
        '<button class="btn primary big" data-act="send"' + (S.sending || !S.strokes.length ? ' disabled' : '') + '>' + (S.sending ? 'Sending…' : 'Send') + '</button></div>';
    } else if (!locked) {
      body += '<div class="s-sent">' + ICON.check + 'Sent</div>' +
        '<div class="s-actions"><button class="btn" data-act="edit">Change my drawing</button></div>';
    } else if (!showPad) {
      body += '<p class="s-note">You didn\'t send a drawing.</p>';
    }
  }

  if (locked) body += '<div class="s-closed">Answers are closed</div>';
  if (S.err) body += '<p class="s-err">' + esc(S.err) + '</p>';

  app.innerHTML = '<div class="s-wrap">' + sTop() + '<div class="s-card">' + prompt + body + '</div></div>';

  const txt = document.getElementById('txt');
  if (txt) {
    txt.oninput = () => { S.text = txt.value; document.getElementById('cnt').textContent = txt.value.length + ' / ' + MAX_TEXT; };
  }
  const cv = document.getElementById('pad');
  if (cv) {
    sizePad();
    S.pad = makePad(cv, S.strokes, {
      editable: () => S.view === 'q' && S.mode !== 'sent' && !S.live.locked && !S.sending,
      color: () => S.color,
      width: () => S.width,
      onChange: () => { S.err = ''; syncDrawButtons(); }
    });
  } else {
    S.pad = null;
  }
}

function sizePad() {
  const box = document.getElementById('padBox');
  if (!box) return;
  const card = box.parentElement;
  const avail = card.clientWidth - 36;
  box.style.width = box.style.height = '0px';
  const rest = card.getBoundingClientRect().bottom + window.scrollY + 20;
  const h = window.innerHeight - rest - 4;
  const s = Math.max(220, Math.min(avail, h, 640));
  box.style.width = s + 'px';
  box.style.height = s + 'px';
}

function syncDrawButtons() {
  const has = S.strokes.length > 0;
  document.querySelectorAll('[data-act=undo],[data-act=clear]').forEach(b => b.disabled = !has);
  const send = document.querySelector('[data-act=send]');
  if (send) send.disabled = S.sending || !has;
}

function sRender() {
  if (!S.name) return sJoin();
  if (!S.live) return sWait();
  sQuestion();
}

function onLive(live) {
  if (!live) {
    if (S.live || S.view !== 'wait') { S.live = null; S.key = ''; sWait(); }
    return;
  }
  const k = live.qid + '_' + live.run;
  if (k !== S.key) {
    S.key = k;
    S.live = live;
    S.err = '';
    S.sending = false;
    const rec = loadRec();
    S.mode = rec && rec.sent ? 'sent' : 'edit';
    S.text = (rec && rec.text) || '';
    S.strokes = (rec && rec.strokes) || [];
    S.choice = rec && typeof rec.choice === 'number' ? rec.choice : null;
    sQuestion();
    return;
  }
  const changed = live.prompt !== S.live.prompt || JSON.stringify(live.options) !== JSON.stringify(S.live.options) || live.locked !== S.live.locked;
  if (changed) {
    S.live = live;
    if (S.view === 'q' && !S.sending) sQuestion();
  }
}

async function sPoll() {
  clearTimeout(S.timer);
  const gen = S.gen = (S.gen || 0) + 1;
  if (S.name) {
    try {
      const r = await api('state');
      if (gen !== S.gen) return;
      if (S.offline) { S.offline = false; updateDot(); }
      if (S.view !== 'join') onLive(r.live);
    } catch (e) {
      if (gen !== S.gen) return;
      if (!S.offline) { S.offline = true; updateDot(); }
    }
  }
  if (gen !== S.gen) return;
  S.timer = setTimeout(sPoll, document.hidden ? 10000 : STUDENT_POLL);
}
function updateDot() {
  const top = document.querySelector('.s-top');
  if (top) top.outerHTML = sTop();
}

async function sSend(answer) {
  if (S.sending) return;
  S.sending = true;
  S.err = '';
  const key = S.key;
  const L = S.live;
  if (L.type !== 'poll') sQuestion();
  try {
    await api('submit', [L.qid, S.sid, S.name, answer]);
    if (key !== S.key) return;
    S.mode = 'sent';
    saveRec({ sent: true, text: S.text, strokes: S.strokes, choice: S.choice });
  } catch (e) {
    if (key !== S.key) return;
    S.err = e.message;
    if (L.type === 'poll') { const rec = loadRec(); S.choice = rec ? rec.choice : null; }
  } finally {
    if (key === S.key) { S.sending = false; sQuestion(); }
  }
}

function studentClicks(e) {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'rename') {
    S.name = '';
    sJoin();
  } else if (act === 'send') {
    if (S.live.type === 'text') {
      S.text = (document.getElementById('txt') || {}).value || S.text;
      if (!S.text.trim()) { S.err = 'Please type an answer first.'; return sQuestion(); }
      sSend({ text: S.text });
    } else {
      if (!S.strokes.length) return;
      sSend({ drawing: JSON.stringify(S.strokes) });
    }
  } else if (act === 'edit') {
    S.mode = 'edit';
    S.err = '';
    sQuestion();
  } else if (act === 'choose') {
    S.choice = Number(b.dataset.i);
    document.querySelectorAll('.opt').forEach((o, i) => o.classList.toggle('on', i === S.choice));
    sSend({ choice: S.choice });
  } else if (act === 'color' || act === 'size') {
    if (act === 'color') S.color = Number(b.dataset.i); else S.width = Number(b.dataset.i);
    document.querySelectorAll('[data-act=' + act + ']').forEach(x => x.classList.toggle('on', x === b));
  } else if (act === 'undo') {
    S.strokes.pop();
    S.pad && S.pad.redraw();
    syncDrawButtons();
  } else if (act === 'clear') {
    S.strokes.length = 0;
    S.pad && S.pad.redraw();
    syncDrawButtons();
  }
}

function startStudent() {
  app.addEventListener('click', studentClicks);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sPoll(); });
  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (S.pad) { sizePad(); S.pad.fit(); } }, 150);
  });
  sRender();
  if (S.name) sPoll();
}

    return '<li class="qi' + (sel ? ' sel' : '') + '" data-act="view" data-id="' + q.id + '">' +
      '<div class="qi-row"><span class="qi-n">' + (i + 1) + '</span><span class="qi-ic">' + ICON[q.type] + '</span>' +
      '<span class="qi-p' + (q.prompt ? '' : ' muted') + '">' + label + '</span>' + badge + '</div>' +
      (sel ? '<div class="qi-acts">' +
        (live ? '' : '<button class="btn small primary" data-act="ask" data-id="' + q.id + '">' + ICON.play + 'Ask</button>') +
        '<button class="btn small" data-act="edit" data-id="' + q.id + '">Edit</button>' +
        '<button class="btn small" data-act="up" data-id="' + q.id + '"' + (i ? '' : ' disabled') + ' aria-label="Move up">↑</button>' +
        '<button class="btn small" data-act="down" data-id="' + q.id + '"' + (i < T.questions.length - 1 ? '' : ' disabled') + ' aria-label="Move down">↓</button>' +
        '<button class="btn small danger" data-act="del" data-id="' + q.id + '">Delete</button>' +
        '</div>' : '') +
      '</li>';
  }).join('');
}

function tMain() {
  const main = document.getElementById('tMain');
  if (!main) return;
  const q = qById(T.viewId);
  if (!q) {
    main.innerHTML = '<div class="welcome"><h1>Ready when you are</h1>' +
      '<p>Show the Join screen so students can scan the QR code. Then ask a quick question, or add your questions on the left.</p>' +
      '<div class="quick-row">' +
        '<button class="btn" data-act="quick" data-type="draw">' + ICON.draw + 'Draw</button>' +
        '<button class="btn" data-act="quick" data-type="text">' + ICON.text + 'Text</button>' +
        '<button class="btn" data-act="quick" data-type="poll">' + ICON.poll + 'Poll A–D</button>' +
      '</div>' +
      '<p style="margin-top:26px"><button class="btn primary big" data-act="join">' + ICON.qr + 'Show Join screen</button></p></div>';
    return;
  }
  const i = qIndex(q.id);
  const live = isLive(q.id);
  let status = '';
  if (live) status = T.live.locked ? '<span class="pill lock">LOCKED</span>' : '<span class="pill live">LIVE ON PHONES</span>';
  let controls = '';
  const dis = T.busy ? ' disabled' : '';
  if (live) {
    const next = T.questions[i + 1];
    controls =
      '<button class="btn big' + (T.live.revealed ? '' : ' primary') + '" data-act="reveal"' + dis + '>' + (T.live.revealed ? ICON.eyeOff + 'Hide answers' : ICON.eye + 'Reveal answers') + '</button>' +
      '<button class="btn big" data-act="lock"' + dis + '>' + (T.live.locked ? ICON.unlock + 'Reopen answers' : ICON.lock + 'Lock answers') + '</button>' +
      (next ? '<button class="btn big" data-act="next"' + dis + '>Next question' + ICON.next + '</button>' : '') +
      '<button class="btn big" data-act="stop"' + dis + '>' + ICON.stop + (next ? 'Stop' : 'Finish') + '</button>';
  } else {
    controls = '<button class="btn big primary" data-act="ask" data-id="' + q.id + '"' + dis + '>' + ICON.play + (q.asked ? 'Ask again' : 'Ask this question') + '</button>';
  }
  main.innerHTML =
    '<div class="q-meta">Question ' + (i + 1) + ' · ' + TYPE_NAME[q.type] + status + '</div>' +
    '<h1 class="q-prompt' + (q.prompt ? '' : ' muted') + '">' + (q.prompt ? esc(q.prompt) : 'No prompt (the question is on your slide)') + '</h1>' +
    '<div class="q-controls">' + controls + '</div>' +
    '<div id="answers"></div>';
  tAnswers();
}

function rowsFor(qid) {
  const a = T.ans[qid];
  if (!a) return null;
  return Object.values(a.rows).sort((x, y) => x.first - y.first);
}

function tAnswers() {
  const box = document.getElementById('answers');
  if (!box) return;
  const q = qById(T.viewId);
  if (!q) { box.innerHTML = ''; return; }
  const rows = rowsFor(q.id);
  if (!rows) { box.innerHTML = '<div class="none">Loading answers…</div>'; return; }
  const visible = rows.filter(r => !r.hidden);
  const hidden = rows.filter(r => r.hidden);
  const live = isLive(q.id);

  if (live && !T.live.revealed) {
    box.innerHTML = '<div class="hold"><div class="hold-n">' + rows.length + '</div>' +
      '<div class="hold-l">' + (rows.length === 1 ? 'answer' : 'answers') + ' so far</div>' +
      '<div class="hold-s">Answers stay hidden until you press Reveal.</div></div>';
    return;
  }
  if (!rows.length) {
    box.innerHTML = '<div class="none">' + (live ? 'No answers yet.' : 'No answers to this question.') + '</div>';
    return;
  }

  let html = '';
  if (q.type === 'poll') {
    const total = visible.length;
    html = '<div class="bars">' + q.options.map((o, i) => {
      const who = visible.filter(r => Number(r.value) === i);
      const pct = total ? Math.round(who.length / total * 100) : 0;
      const plain = o.trim().toUpperCase() === LETTERS[i];
      return '<div class="bar-row"><div class="bar-label"><span class="let">' + LETTERS[i] + '</span>' + (plain ? '' : esc(o)) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-num">' + who.length + '<small>' + pct + '%</small></div>' +
        (T.names && who.length ? '<div class="bar-names">' + who.map(r => esc(r.name)).join(', ') + '</div>' : '') +
        '</div>';
    }).join('') + '</div>';
  } else {
    html = tileGrid(q, visible, false);
  }
  if (hidden.length) {
    html += '<div class="hidden-bar">' + hidden.length + ' hidden ' + (hidden.length === 1 ? 'answer' : 'answers') +
      ' <button class="btn small" data-act="toggleHidden">' + (T.showHidden ? 'Hide list' : 'Show') + '</button></div>';
    if (T.showHidden) {
      html += q.type === 'poll'
        ? '<div class="grid" style="margin-top:12px;--tile:220px">' + hidden.map(r => '<div class="tile"><div class="card s4">' + esc(r.name) + ': ' + LETTERS[Number(r.value)] + '</div><div class="who"><button class="btn small" data-act="unhide" data-sid="' + r.sid + '">Unhide</button></div></div>').join('') + '</div>'
        : '<div style="margin-top:12px">' + tileGrid(q, hidden, true) + '</div>';
    }
  }
  box.innerHTML = html;
}

function textSize(t) {
  const n = t.length;
  return n < 25 ? 's1' : n < 70 ? 's2' : n < 160 ? 's3' : 's4';
}

function tileGrid(q, rows, dim) {
  const n = rows.length;
  const tile = q.type === 'draw'
    ? (n <= 3 ? 340 : n <= 8 ? 260 : n <= 16 ? 210 : 170)
    : (n <= 4 ? 320 : 260);
  return '<div class="grid' + (dim ? ' dim' : '') + '" style="--tile:' + tile + 'px">' + rows.map(r => {
    const inner = q.type === 'draw'
      ? '<img alt="Drawing" src="' + drawingUrl(r.value, r.sid + '_' + r.u) + '">'
      : '<div class="card ' + textSize(r.value) + '">' + esc(r.value) + '</div>';
    const who = dim
      ? '<div class="who"><button class="btn small" data-act="unhide" data-sid="' + r.sid + '">Unhide</button>' + (T.names ? ' ' + esc(r.name) : '') + '</div>'
      : (T.names ? '<div class="who">' + esc(r.name) + '</div>' : '');
    return dim
      ? '<div class="tile">' + inner + who + '</div>'
      : '<button class="tile" data-act="spot" data-sid="' + r.sid + '">' + inner + who + '</button>';
  }).join('') + '</div>';
}

/* ---- polling for answers ---- */

async function tPoll() {
  clearTimeout(T.timer);
  const gen = T.gen = (T.gen || 0) + 1;
  const qid = T.viewId;
  if (qid && qById(qid)) {
    const a = T.ans[qid] || (T.ans[qid] = { u: 0, rows: {} });
    try {
      const r = await tapi('answers', [qid, a.u]);
      if (T.ans[qid] === a) {
        let changed = !a.loaded;
        a.loaded = true;
        r.rows.forEach(row => {
          const old = a.rows[row.sid];
          row.first = old ? old.first : row.u;
          a.rows[row.sid] = row;
          changed = true;
        });
        a.u = Math.max(a.u, r.u);
        if (changed) {
          T.counts[qid] = Object.keys(a.rows).length;
          if (qid === T.viewId) { tAnswers(); tSide(); if (T.spot) tSpotRender(); }
        }
      }
    } catch (e) {
      if (e.message === 'WRONG_KEY') return;
    }
  }
  if (gen !== T.gen) return;
  T.timer = setTimeout(tPoll, document.hidden ? 8000 : TEACHER_POLL);
}

/* ---- actions ---- */

async function run(fn) {
  if (T.busy) return;
  T.busy = true;
  document.querySelectorAll('.q-controls .btn, .qi-acts .btn, .quick-row .btn').forEach(b => b.disabled = true);
  try { await fn(); }
  catch (e) { if (e.message !== 'WRONG_KEY') toast(e.message, true); }
  finally {
    T.busy = false;
    document.querySelectorAll('.quick-row .btn').forEach(b => b.disabled = false);
    if (document.getElementById('tMain')) { tHeader(); tSide(); tMain(); }
  }
}

function applyQuestions(r) {
  if (r.questions) T.questions = r.questions;
  if ('live' in r) T.live = r.live;
}

async function askQuestion(id) {
  const n = T.counts[id] || 0;
  let fresh = false;
  if (n > 0 && !isLive(id)) {
    const choice = await confirmBox('This question already has ' + n + ' ' + (n === 1 ? 'answer' : 'answers'),
      'They may be from your other group. Start fresh, or keep them and add the new answers?',
      [['cancel', 'Cancel'], ['keep', 'Keep them'], ['fresh', 'Start fresh', 'primary']]);
    if (choice === 'cancel' || !choice) return;
    fresh = choice === 'fresh';
  }
  await run(async () => {
    const r = await tapi('ask', [id, fresh]);
    applyQuestions(r);
    if (fresh) { delete T.ans[id]; T.counts[id] = 0; }
    T.viewId = id;
    tPoll();
  });
}

async function quick(type) {
  await run(async () => {
    const q = { type: type, prompt: '', options: type === 'poll' ? ['A', 'B', 'C', 'D'] : [] };
    const r = await tapi('saveQuestion', [q]);
    applyQuestions(r);
    const a = await tapi('ask', [r.id, false]);
    applyQuestions(a);
    T.viewId = r.id;
    tPoll();
  });
}

function teacherClicks(e) {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const id = b.dataset.id;
  if (act === 'view') {
    if (T.viewId !== id) {
      T.viewId = id;
      T.showHidden = false;
      tSide(); tMain(); tPoll();
    }
  } else if (act === 'ask') {
    e.stopPropagation();
    askQuestion(id);
  } else if (act === 'quick') {
    quick(b.dataset.type);
  } else if (act === 'add') {
    editor(null);
  } else if (act === 'edit') {
    e.stopPropagation();
    editor(qById(id));
  } else if (act === 'up' || act === 'down') {
    e.stopPropagation();
    run(async () => applyQuestions(await tapi('moveQuestion', [id, act === 'up' ? -1 : 1])));
  } else if (act === 'del') {
    e.stopPropagation();
    const q = qById(id);
    confirmBox('Delete this question?', 'Its answers will be deleted too.', [['cancel', 'Cancel'], ['del', 'Delete', 'danger']]).then(c => {
      if (c !== 'del') return;
      run(async () => {
        applyQuestions(await tapi('deleteQuestion', [id]));
        delete T.ans[id];
        delete T.counts[id];
        if (T.viewId === id) {
          const i = Math.min(T.questions.length - 1, Math.max(0, T.questions.findIndex(x => x.id === q.id)));
          T.viewId = T.live ? T.live.qid : (T.questions[i] ? T.questions[i].id : null);
        }
      });
    });
  } else if (act === 'reveal') {
    run(async () => applyQuestions(await tapi('setLive', [{ revealed: !T.live.revealed }])));
  } else if (act === 'lock') {
    run(async () => applyQuestions(await tapi('setLive', [{ locked: !T.live.locked }])));
  } else if (act === 'next') {
    const next = T.questions[qIndex(T.live.qid) + 1];
    if (next) askQuestion(next.id);
  } else if (act === 'stop') {
    run(async () => applyQuestions(await tapi('stop')));
  } else if (act === 'names') {
    T.names = !T.names;
    tHeader(); tAnswers();
    if (T.spot) tSpotRender();
  } else if (act === 'focus') {
    T.focus = !T.focus;
    tHeader();
  } else if (act === 'join') {
    showJoin();
  } else if (act === 'toggleHidden') {
    T.showHidden = !T.showHidden;
    tAnswers();
  } else if (act === 'unhide') {
    setHidden(T.viewId, b.dataset.sid, false);
  } else if (act === 'spot') {
    T.spot = b.dataset.sid;
    tSpotRender();
  } else if (act === 'clearAll') {
    confirmBox('Clear all answers?', 'Use this before a new class. Your questions are kept, and phones go back to waiting.',
      [['cancel', 'Cancel'], ['clear', 'Clear answers', 'danger']]).then(c => {
      if (c !== 'clear') return;
      run(async () => {
        applyQuestions(await tapi('clearAnswers'));
        T.ans = {}; T.counts = {};
        imgCache.clear();
        tPoll();
        toast('Answers cleared.');
      });
    });
  } else if (act === 'forget') {
    store('lq_key', null);
    T.key = '';
    tKeyScreen();
  }
}

async function setHidden(qid, sid, hidden) {
  try {
    await tapi('hideAnswer', [qid, sid, hidden]);
    const a = T.ans[qid];
    if (a && a.rows[sid]) a.rows[sid].hidden = hidden;
    tAnswers();
  } catch (e) {
    if (e.message !== 'WRONG_KEY') toast(e.message, true);
  }
}

/* ---- spotlight ---- */

function spotRows() {
  const q = qById(T.viewId);
  const rows = q ? (rowsFor(q.id) || []).filter(r => !r.hidden) : [];
  return { q: q, rows: rows };
}

function tSpotRender() {
  let ov = document.getElementById('spotOv');
  const { q, rows } = spotRows();
  const i = rows.findIndex(r => r.sid === T.spot);
  if (!q || i < 0 || (isLive(q.id) && !T.live.revealed)) { closeSpot(); return; }
  const r = rows[i];
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'spotOv';
    ov.className = 'ov dark';
    document.body.appendChild(ov);
    ov.addEventListener('click', ev => {
      const b = ev.target.closest('[data-sp]');
      if (!b) { if (ev.target === ov || ev.target.classList.contains('spot')) closeSpot(); return; }
      const k = b.dataset.sp;
      if (k === 'close') closeSpot();
      else if (k === 'prev' || k === 'next') moveSpot(k === 'prev' ? -1 : 1);
      else if (k === 'hide') {
        const sid = T.spot;
        moveSpot(1, true);
        setHidden(T.viewId, sid, true).then(() => tSpotRender());
      }
    });
  }
  const body = q.type === 'draw'
    ? '<img alt="Drawing" src="' + drawingUrl(r.value, r.sid + '_' + r.u) + '">'
    : '<div class="card">' + esc(r.value) + '</div>';
  ov.innerHTML = '<div class="spot"><div class="spot-body">' + body + '</div>' +
    '<div class="spot-bar">' +
      '<button class="btn" data-sp="prev"' + (rows.length > 1 ? '' : ' disabled') + '>← Previous</button>' +
      '<span class="who">' + (T.names ? esc(r.name) + ' · ' : '') + (i + 1) + ' / ' + rows.length + '</span>' +
      '<button class="btn" data-sp="next"' + (rows.length > 1 ? '' : ' disabled') + '>Next →</button>' +
      '<button class="btn" data-sp="hide">' + ICON.eyeOff + 'Hide</button>' +
      '<button class="btn" data-sp="close">Close</button>' +
    '</div></div>';
}

function moveSpot(d, quiet) {
  const { rows } = spotRows();
  if (!rows.length) return closeSpot();
  const i = rows.findIndex(r => r.sid === T.spot);
  const ni = (i + d + rows.length) % rows.length;
  if (rows[ni].sid === T.spot) { if (quiet) T.spot = null; return quiet ? closeSpot() : null; }
  T.spot = rows[ni].sid;
  if (!quiet) tSpotRender();
}

function closeSpot() {
  T.spot = null;
  const ov = document.getElementById('spotOv');
  if (ov) ov.remove();
}

/* ---- join screen with QR ---- */

function studentUrl() { return location.origin + location.pathname; }

function showJoin() {
  const ov = document.createElement('div');
  ov.className = 'ov dark';
  const url = studentUrl();
  ov.innerHTML = '<div class="qr-box"><h2>Join the class</h2><p>Scan with your phone camera</p>' +
    '<div id="qr"></div><div class="qr-url">' + esc(url.replace(/^https?:\/\//, '')) + '</div>' +
    '<p style="margin:18px 0 0"><button class="btn big" data-x>Close</button></p></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-x]')) ov.remove(); });
  loadQr().then(() => {
    const el = document.getElementById('qr');
    if (!el) return;
    new QRCode(el, { text: url, width: 680, height: 680, correctLevel: QRCode.CorrectLevel.M });
  }).catch(() => {
    const el = document.getElementById('qr');
    if (el) el.innerHTML = '<p style="color:var(--muted)">The QR code could not load. Students can type the address below.</p>';
  });
}

let qrPromise = null;
function loadQr() {
  if (window.QRCode) return Promise.resolve();
  if (qrPromise) return qrPromise;
  qrPromise = new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = ok;
    s.onerror = () => { qrPromise = null; fail(); };
    document.head.appendChild(s);
  });
  return qrPromise;
}

/* ---- dialogs ---- */

function confirmBox(title, text, buttons) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = '<div class="modal" role="dialog"><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p><div class="acts">' +
      buttons.map(b => '<button class="btn ' + (b[2] || '') + '" data-c="' + b[0] + '">' + esc(b[1]) + '</button>').join('') + '</div></div>';
    document.body.appendChild(ov);
    const done = v => { ov.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const key = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', key);
    ov.addEventListener('click', e => {
      if (e.target === ov) return done(null);
      const b = e.target.closest('[data-c]');
      if (b) done(b.dataset.c);
    });
    const last = ov.querySelector('.acts .btn:last-child');
    if (last) last.focus();
  });
}

function editor(q) {
  const ed = {
    id: q ? q.id : null,
    type: q ? q.type : 'text',
    prompt: q ? q.prompt : '',
    options: q && q.type === 'poll' ? q.options.slice() : ['', '']
  };
  const ov = document.createElement('div');
  ov.className = 'ov';
  document.body.appendChild(ov);

  function readFields() {
    const p = ov.querySelector('#edPrompt');
    if (p) ed.prompt = p.value;
    ov.querySelectorAll('[data-opt]').forEach(inp => { ed.options[Number(inp.dataset.opt)] = inp.value; });
  }
  function draw() {
    ov.innerHTML = '<div class="modal" role="dialog"><h2>' + (ed.id ? 'Edit question' : 'New question') + '</h2>' +
      '<div class="seg">' + ['draw', 'text', 'poll'].map(t =>
        '<button class="' + (ed.type === t ? 'on' : '') + '" data-ed="type" data-t="' + t + '">' + ICON[t] + TYPE_NAME[t] + '</button>').join('') + '</div>' +
      '<label class="lbl" for="edPrompt">Question</label>' +
      '<textarea class="field" id="edPrompt" maxlength="300" style="min-height:84px" placeholder="Optional. Leave it blank if the question is on your slide.">' + esc(ed.prompt) + '</textarea>' +
      '<p class="hint">' + (ed.type === 'draw' ? 'Students draw on their phone.' : ed.type === 'text' ? 'Students type a short answer (up to 500 characters).' : 'Students tap one option.') + '</p>' +
      (ed.type === 'poll'
        ? '<div style="margin-top:16px"><span class="lbl">Options</span>' +
          '<div class="presets"><button class="btn small" data-ed="preset" data-p="ABCD">A B C D</button>' +
          '<button class="btn small" data-ed="preset" data-p="yn">Yes / No</button>' +
          '<button class="btn small" data-ed="preset" data-p="tf">True / False</button></div>' +
          ed.options.map((o, i) => '<div class="optrow"><span class="let">' + LETTERS[i] + '</span>' +
            '<input class="field" data-opt="' + i + '" maxlength="60" value="' + esc(o) + '" placeholder="Option ' + LETTERS[i] + '">' +
            (ed.options.length > 2 ? '<button class="btn small ghost" data-ed="rm" data-i="' + i + '" aria-label="Remove option">✕</button>' : '') + '</div>').join('') +
          (ed.options.length < 6 ? '<button class="btn small" data-ed="addopt">+ Add option</button>' : '') +
          '</div>'
        : '') +
      '<div class="acts"><button class="btn" data-ed="cancel">Cancel</button>' +
      '<button class="btn" data-ed="save">Save</button>' +
      '<button class="btn primary" data-ed="saveAsk">' + ICON.play + 'Save and ask now</button></div></div>';
  }
  draw();
  setTimeout(() => { const p = ov.querySelector('#edPrompt'); if (p) p.focus(); }, 30);

  const close = () => { ov.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);

  ov.addEventListener('click', async e => {
    if (e.target === ov) return close();
    const b = e.target.closest('[data-ed]');
    if (!b || b.disabled) return;
    readFields();
    const a = b.dataset.ed;
    if (a === 'type') { ed.type = b.dataset.t; draw(); }
    else if (a === 'preset') {
      ed.options = { ABCD: ['A', 'B', 'C', 'D'], yn: ['Yes', 'No'], tf: ['True', 'False'] }[b.dataset.p].slice();
      draw();
    }
    else if (a === 'addopt') { ed.options.push(''); draw(); const ins = ov.querySelectorAll('[data-opt]'); ins[ins.length - 1].focus(); }
    else if (a === 'rm') { ed.options.splice(Number(b.dataset.i), 1); draw(); }
    else if (a === 'cancel') close();
    else if (a === 'save' || a === 'saveAsk') {
      const payload = { id: ed.id, type: ed.type, prompt: ed.prompt.trim(), options: ed.type === 'poll' ? ed.options.map(o => o.trim()).filter(Boolean) : [] };
      if (ed.type === 'poll' && payload.options.length < 2) { toast('A poll needs at least two options.', true); return; }
      ov.querySelectorAll('.acts .btn').forEach(x => x.disabled = true);
      try {
        const r = await tapi('saveQuestion', [payload]);
        applyQuestions(r);
        T.viewId = r.id;
        close();
        tHeader(); tSide(); tMain(); tPoll();
        if (a === 'saveAsk' && !isLive(r.id)) askQuestion(r.id);
      } catch (err) {
        ov.querySelectorAll('.acts .btn').forEach(x => x.disabled = false);
        if (err.message !== 'WRONG_KEY') toast(err.message, true);
        else close();
      }
    }
  });
}

function startTeacher() {
  app.addEventListener('click', teacherClicks);
  document.addEventListener('keydown', e => {
    if (!T.spot) return;
    if (e.key === 'Escape') closeSpot();
    else if (e.key === 'ArrowRight') moveSpot(1);
    else if (e.key === 'ArrowLeft') moveSpot(-1);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && T.key) tPoll(); });
  const m = location.hash.match(/^#t=(.+)$/);
  if (m) {
    store('lq_key', decodeURIComponent(m[1]));
    history.replaceState(null, '', location.pathname + '#teacher');
  }
  T.key = store('lq_key') || '';
  if (T.key) tStart(); else tKeyScreen();
}

/* ---------------- start ---------------- */

if (API.indexOf('PASTE_') === 0) {
  app.innerHTML = '<div class="keybox"><h1>Almost there</h1><p style="color:var(--muted)">Open live.html and paste your Apps Script web app link into the line that starts with <b>const API</b>.</p></div>';
} else if (location.hash === '#teacher' || location.hash.indexOf('#t=') === 0) {
  document.title = 'Live Questions · Teacher';
  startTeacher();
} else {
  startStudent();
}
</script>
